name: Daily GOR Update

on:
  schedule:
    - cron: '15 21 * * *'  # 21:15 UTC = 05:15 Beijing, after US close
  workflow_dispatch:       # manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy matplotlib requests lxml
          pip install fredapi python-dotenv akshare

      - name: Create .env
        env:
          FRED_KEY: ${{ secrets.FRED_API_KEY }}
          FIGI_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          echo "FRED_API_KEY=${FRED_KEY}" > .env
          echo "OPENFIGI_API_KEY=${FIGI_KEY}" >> .env

      - name: Unit tests
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: Run daily update
        run: python scripts/gor_daily.py

      - name: Gold macro validator (easing score)
        run: python run.py --mode goldmac

      - name: Update model portfolio
        run: python scripts/update_model_portfolio.py

      - name: Alert check (daily close)
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALERT_MIN_SEVERITY: P0
        run: python scripts/alert_check.py --send --write

      - name: Commit & push changes
        run: |
          git config user.name "Deep-Risk Bot"
          git config user.email "bot@deep-risk.dev"
          git add -A
          git diff --staged --quiet || git commit -m "Auto: daily GOR update [$(date +%Y-%m-%d)]"
          git push