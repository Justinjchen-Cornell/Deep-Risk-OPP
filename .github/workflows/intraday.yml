name: Intraday Alert Check

on:
  schedule:
    # US-hours: every 15 minutes (UTC 12:00-21:00, Mon-Fri)
    - cron: '*/15 12-21 * * 1-5'
    # Off-hours: hourly (UTC 00:00-11:59 and 22:00-23:59, Mon-Fri)
    - cron: '0 0-11,22-23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: alert-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run alert check
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/alert_check.py --intraday --send --write

      - name: Commit alert state
        run: |
          git config user.name "Deep-Risk Alert Bot"
          git config user.email "alert@deep-risk.dev"
          git add alerts
          if git diff --staged --quiet; then
            echo "No state change — nothing to commit."
            exit 0
          fi
          git commit -m "Alert: intraday state [$(date -u +%FT%TZ)]"
          git pull --rebase origin main
          git push
